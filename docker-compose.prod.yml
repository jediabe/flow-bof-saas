# Production Docker Compose for flow-bof-saas.
#
# Three services:
#   - app   :  Next.js (standalone) running as `node server.js`.
#   - db    :  Postgres 16.
#   - caddy :  HTTPS reverse proxy (Let's Encrypt auto-cert).
#
# Local dev does NOT use this file — `npm run dev` keeps using SQLite.
# Bring this up only on the VPS:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Volumes:
#   - ./uploads          : Kalodata-downloaded reference images. Mounted
#                          into the app container so they survive
#                          rebuilds + container restarts.
#   - postgres_data      : Postgres data directory.
#   - caddy_data/config  : Let's Encrypt certs + Caddy state.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time args. NEXT_PUBLIC_* env vars must be present when
      # `next build` runs (they're inlined into the client bundle as
      # string literals). env_file: alone only sets them at RUNTIME
      # for the container, which is too late — by then `next build`
      # has already produced the static JS with empty placeholders.
      # The interpolation `${VAR}` reads from the .env file passed
      # via `docker compose --env-file .env.production`.
      args:
        NEXT_PUBLIC_RUNNER_WINDOWS_RELEASE_URL: ${NEXT_PUBLIC_RUNNER_WINDOWS_RELEASE_URL:-}
        NEXT_PUBLIC_RUNNER_MAC_RELEASE_URL: ${NEXT_PUBLIC_RUNNER_MAC_RELEASE_URL:-}
        NEXT_PUBLIC_RUNNER_RELEASES_URL: ${NEXT_PUBLIC_RUNNER_RELEASES_URL:-}
    container_name: flow-bof-saas
    restart: unless-stopped
    env_file:
      - .env.production
    # No host port: Caddy is the only thing that talks to :3000.
    # Compose's default bridge network resolves "app" by name.
    expose:
      - "3000"
    volumes:
      # Reference images downloaded by the Kalodata importer live
      # under /app/public/uploads in the container. Bind-mounting a
      # host directory means they survive container restarts and
      # rebuilds. The host path is created on first `docker compose up`.
      - ./uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: flow-bof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Do NOT publish 5432 to the host — the database is internal-only.
    # If you need to connect with psql from the VPS itself, do it from
    # inside the container: `docker compose exec db psql -U $POSTGRES_USER -d $POSTGRES_DB`
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: flow-bof-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # APP_DOMAIN is substituted into Caddyfile via Caddy's native
      # {$VAR} support. Set it in .env.production.
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # SAME host directory the app writes uploaded images into,
      # mounted read-only so Caddy can serve /uploads/* directly
      # (Next.js standalone won't serve runtime-added public/ files;
      # see the @uploads block in Caddyfile for the why).
      - ./uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Auto-refresh cron sidecar for the BOF Dashboard.
  #
  # Hits /api/cron/{health-and-revenue,products} on a schedule:
  #   - health-and-revenue: every 6 hours (00:00, 06:00, 12:00, 18:00)
  #   - products:           once a day at 03:15 (both times in $TZ)
  # See docker/cron/entrypoint.sh for the crontab definition.
  #
  # Auth: passes CRON_SECRET from env_file as a Bearer token, which
  # /api/cron/[task]/route.ts validates with a constant-time
  # compare. If CRON_SECRET is unset the container refuses to
  # start rather than silently doing nothing.
  #
  # Network: reaches the app over the default compose network by
  # service name (http://app:3000), so no host port publishing is
  # needed and the /api/cron/* routes never need to be exposed
  # publicly.
  cron:
    build:
      context: ./docker/cron
      dockerfile: Dockerfile
    container_name: flow-bof-cron
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Internal-network URL the sidecar hits. Overridable if the
      # app service is renamed. Never leaks outside the compose net.
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
